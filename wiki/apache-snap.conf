# Short URLs: /wiki/Page_name and the bare / both go to MediaWiki at /w (item 3).
<Directory /var/www/html>
    RewriteEngine On
    RewriteRule ^/?wiki(/.*)?$ %{DOCUMENT_ROOT}/w/index.php [L]
    RewriteRule ^/*$ %{DOCUMENT_ROOT}/w/index.php [L]
</Directory>

# Uploaded files are never run as code, and deleted files are never served.
<Directory /var/www/html/w/images>
    php_admin_value engine Off
    Options -Indexes
    Header set X-Content-Type-Options nosniff
</Directory>
<Directory /var/www/html/w/images/deleted>
    Require all denied
</Directory>
